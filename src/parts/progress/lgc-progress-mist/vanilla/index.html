<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mist Progress — example</title><link rel="stylesheet" href="../styles.css"></head><body><main style="padding:32px;max-width:440px;margin:auto"><div class="sop-foundation lgc-root sop-lgc-progress-mist" data-foundation="progress" data-variant="soft"><div class="ff-heading"><span data-ff-label>ここまでの歩みを。</span><span class="ff-eyebrow" aria-hidden="true">STATE / PLAY</span></div><p class="ff-description" data-ff-description></p><div class="ff-progress-visual"><div class="ff-progress-track" aria-hidden="true"><span class="ff-progress-fill"></span></div><div class="ff-progress-ring" aria-hidden="true"><svg viewBox="0 0 120 120"><circle class="ff-ring-base" cx="60" cy="60" r="51"/><circle class="ff-ring-value" cx="60" cy="60" r="51" pathLength="100"/></svg></div><output class="ff-reading" data-progress-reading>0<small>%</small></output></div><progress data-progress max="100" value="0" class="ff-sr" aria-label="ここまでの歩みを。"></progress><div class="ff-process-steps" aria-hidden="true"><span>01 準備</span><span>02 処理</span><span>03 完了</span></div></div>
</main><script type="module" src="./main.ts"></script></body></html>
