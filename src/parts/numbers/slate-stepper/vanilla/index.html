<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slate Stepper — example</title><link rel="stylesheet" href="../styles.css"></head><body><main style="padding:32px;max-width:440px;margin:auto"><div class="sop-foundation sop-slate-stepper" data-foundation="numbers" data-variant="slate"><div class="ff-heading"><span data-ff-label>必要な量を、ちょうどよく。</span><span class="ff-eyebrow" aria-hidden="true">STATE / PLAY</span></div><p class="ff-description" data-ff-description></p><div class="ff-stepper"><button type="button" data-adjust="-1" aria-label="減らす">−</button><div class="ff-number-face"><input data-number type="text" inputmode="decimal" role="spinbutton" aria-label="必要な量を、ちょうどよく。"><span data-unit class="ff-unit">REM</span></div><button type="button" data-adjust="1" aria-label="増やす">＋</button></div><p class="ff-footnote" data-number-hint>直接入力、または ± で調整できます。</p></div>
</main><script type="module" src="./main.ts"></script></body></html>
