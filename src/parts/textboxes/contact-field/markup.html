<div class="sop-textfield sop-contact-field" data-multiline="false" data-clearable="true" data-auto-grow="false" data-show-count="false" data-validate="blur">
  <div class="sop-field-heading"><label class="sop-field-label">メールアドレス</label></div>
  <div class="sop-field-shell">
    <span class="sop-field-fx" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="sop-field-symbol" aria-hidden="true"></span>
    <input class="sop-field-control" name="contact-field" aria-label="メールアドレス" placeholder="you@example.com" maxlength="120" autocomplete="email" type="email">
    <button type="button" class="sop-field-clear" aria-label="メールアドレスをクリア" hidden><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m6 6 8 8m0-8-8 8"/></svg></button>
  </div>
  <div class="sop-field-meta"><span class="sop-field-help">メールの形式を確認します。</span><span class="sop-field-counter" aria-hidden="true"></span></div>
  <p class="sop-field-validation" aria-live="polite" hidden></p>
  <div class="sop-field-baseline" aria-hidden="true"><i></i><i></i><i></i><span></span></div>
</div>
