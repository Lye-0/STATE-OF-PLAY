<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capsule Field · example</title><link rel="stylesheet" href="../styles.css"></head><body><main style="max-width:440px;margin:40px auto;padding:24px;background:#181b1d;color:#eee"><div class="sop-textfield sop-capsule-field" data-multiline="false" data-clearable="false" data-auto-grow="false" data-show-count="true" data-validate="submit">
  <div class="sop-field-heading"><label class="sop-field-label">プライベートメモ</label><span class="sop-field-caption" aria-hidden="true">PRIVATE / LOCAL</span></div>
  <div class="sop-field-shell">
    <span class="sop-field-fx" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="sop-field-symbol" aria-hidden="true"></span>
    <input class="sop-field-control" name="capsule-field" aria-label="プライベートメモ" placeholder="ここだけの、ひとこと。" maxlength="120" autocomplete="new-password" type="password">
    <button type="button" class="sop-field-reveal" aria-label="パスワードを表示" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2 10s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5Z"/><circle cx="10" cy="10" r="2"/><path class="sop-field-eye-slash" d="m3 3 14 14"/></svg></button>
  </div>
  <div class="sop-field-meta"><span class="sop-field-help">入力はこのページ内だけで扱い、保存・送信しません。</span><span class="sop-field-counter" aria-hidden="true"></span></div>
  <p class="sop-field-validation" aria-live="polite" hidden></p>
  <div class="sop-field-baseline" aria-hidden="true"><i></i><i></i><i></i><span></span></div>
</div>
</main><script type="module" src="./main.ts"></script></body></html>
