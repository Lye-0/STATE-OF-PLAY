<div class="sop-textfield sop-password-field" data-multiline="false" data-clearable="false" data-auto-grow="false" data-show-count="false" data-validate="submit">
  <div class="sop-field-heading"><label class="sop-field-label">パスワード</label></div>
  <div class="sop-field-shell">
    <span class="sop-field-fx" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="sop-field-symbol" aria-hidden="true"></span>
    <input class="sop-field-control" name="password-field" aria-label="パスワード" placeholder="パスワードを入力" maxlength="120" autocomplete="new-password" type="password">
    <button type="button" class="sop-field-reveal" aria-label="パスワードを表示" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2 10s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5Z"/><circle cx="10" cy="10" r="2"/><path class="sop-field-eye-slash" d="m3 3 14 14"/></svg></button>

  <div class="sop-field-meta"><span class="sop-field-help">入力はこのページ内だけで扱い、保存・送信しません。</span><span class="sop-field-counter" aria-hidden="true"></span></div>
  <p class="sop-field-validation" aria-live="polite" hidden></p>
  <div class="sop-field-baseline" aria-hidden="true"><i></i><i></i><i></i><span></span></div>
</div>
