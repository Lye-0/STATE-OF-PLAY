<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letterpress Note · example</title><link rel="stylesheet" href="../styles.css"></head><body><main style="max-width:440px;margin:40px auto;padding:24px;background:#181b1d;color:#eee"><div class="sop-textfield sop-letterpress-note" data-multiline="true" data-clearable="false" data-auto-grow="true" data-show-count="true" data-validate="submit">
  <div class="sop-field-heading"><label class="sop-field-label">余白に、ひとこと</label><span class="sop-field-caption" aria-hidden="true">NOTES / Nº 01</span></div>
  <div class="sop-field-shell">
    <span class="sop-field-fx" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="sop-field-symbol" aria-hidden="true"></span>
    <textarea class="sop-field-control" name="letterpress-note" aria-label="余白に、ひとこと" placeholder="ここから、物語が始まります。" maxlength="500" rows="3"></textarea>
    
  </div>
  <div class="sop-field-meta"><span class="sop-field-help">複数行で入力できます。長さに合わせて高さを調整。</span><span class="sop-field-counter" aria-hidden="true"></span></div>
  <p class="sop-field-validation" aria-live="polite" hidden></p>
  <div class="sop-field-baseline" aria-hidden="true"><i></i><i></i><i></i><span></span></div>
</div>
</main><script type="module" src="./main.ts"></script></body></html>
