<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Origami Selector</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#171b1a;color:#eef0e7;font-family:Arial,"Yu Gothic",sans-serif;padding:30px}main{max-width:580px;margin:30px auto}</style></head><body><main><div class="sop-choice sop-segments sop-origami-segments" data-selection-kind="segments" data-value="choice-2" data-orientation="horizontal"><div class="sop-choice-list" role="radiogroup" aria-label="Origami Selector"><span class="sop-choice-marker" aria-hidden="true"></span><label class="sop-choice-item" data-choice-value="choice-1" data-selected="false"><input type="radio" value="choice-1" aria-label="Calm"><span class="sop-choice-index" aria-hidden="true">01</span><span class="sop-choice-label">Calm</span><span class="sop-choice-dot" aria-hidden="true"></span></label><label class="sop-choice-item" data-choice-value="choice-2" data-selected="true"><input type="radio" value="choice-2" aria-label="Play" checked><span class="sop-choice-index" aria-hidden="true">02</span><span class="sop-choice-label">Play</span><span class="sop-choice-dot" aria-hidden="true"></span></label><label class="sop-choice-item" data-choice-value="choice-3" data-selected="false"><input type="radio" value="choice-3" aria-label="Explore"><span class="sop-choice-index" aria-hidden="true">03</span><span class="sop-choice-label">Explore</span><span class="sop-choice-dot" aria-hidden="true"></span></label></div></div>
