<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compact Dropzone — example</title><link rel="stylesheet" href="../styles.css"></head><body><main style="padding:32px;max-width:440px;margin:auto"><div class="sop-foundation sop-compact-dropzone" data-foundation="uploads" data-variant="compact"><div class="ff-heading"><span data-ff-label>アイデアの素材を、ここに。</span><span class="ff-eyebrow" aria-hidden="true">STATE / PLAY</span></div><p class="ff-description" data-ff-description></p><div class="ff-dropzone" data-drop><input type="file" data-upload aria-label="アイデアの素材を、ここに。"><span class="ff-upload-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/></svg></span><strong>ここにドロップ</strong><span>または <u>ファイルを選ぶ</u></span><small data-upload-limits></small></div><ul class="ff-upload-files" data-upload-files></ul><p class="ff-upload-errors" data-upload-error role="status"></p><p class="ff-footnote">ローカルで選択・確認。送信処理はアプリ側へ接続します。</p></div>
