<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copper Dropzone</title><link rel="stylesheet" href="../styles.css"></head><body><div class="sop-foundation sop-continuum sop-copper-dropzone" data-foundation="uploads" data-variant="copper"><div class="ff-heading"><span data-ff-label>アイデアの素材を、ここに。</span><span class="ff-eyebrow" aria-hidden="true">STATE / PLAY</span></div><p class="ff-description" data-ff-description></p><div class="ff-dropzone ct-intake" data-drop><input type="file" data-upload aria-label="アイデアの素材を、ここに。"><div class="ct-intake-scene" aria-hidden="true"></div><div class="ct-intake-copy"><strong data-intake-label>ファイルを迎え入れる</strong><span>ドロップ、またはクリックして選択</span></div><small data-upload-limits></small><span class="ct-intake-corners" aria-hidden="true"></span></div><div class="ct-file-summary"><span data-file-summary>ファイル未選択</span><span>LOCAL ONLY</span></div><ul class="ff-upload-files" data-upload-files aria-label="選択したファイル"></ul><p class="ff-upload-errors" data-upload-error role="status"></p></div>
<script type="module" src="./main.ts"></script></body></html>
