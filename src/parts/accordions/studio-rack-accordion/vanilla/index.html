<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio Rack</title><link rel="stylesheet" href="../styles.css"></head><body style="padding:40px;background:#191b1d"><div class="sop-accordion sop-studio-rack-accordion" data-sop-accordion="" data-multiple="false">
<section class="sop-accordion-item" data-value="section-1" data-open="true"><h3 class="sop-accordion-heading"><button type="button" class="sop-accordion-trigger" aria-expanded="true"><span class="sop-accordion-index" aria-hidden="true">01</span><span class="sop-accordion-title"><b>Signal chain</b><small>入力から出力まで</small></span><span class="sop-accordion-badge">STEREO</span><span class="sop-accordion-sign" aria-hidden="true"></span></button></h3><div class="sop-accordion-panel" role="region" aria-hidden="false" ><div class="sop-accordion-clip"><div class="sop-accordion-content"><div class="sop-panel-art" aria-hidden="true"><span>AUDIO / STUDY 01</span></div><p>必要な音だけを丁寧につなぐ。入力、空間、出力の順で、聴き心地を整えます。</p><div class="sop-panel-metrics"><div><b>48</b><small>KHZ</small></div><div><b>-6</b><small>DB HEADROOM</small></div><div><b>2.4</b><small>MS LATENCY</small></div></div></div></div></div></section>
<section class="sop-accordion-item" data-value="section-2" data-open="false"><h3 class="sop-accordion-heading"><button type="button" class="sop-accordion-trigger" aria-expanded="false"><span class="sop-accordion-index" aria-hidden="true">02</span><span class="sop-accordion-title"><b>Room response</b><small>空間の響き</small></span><span class="sop-accordion-badge">WARM</span><span class="sop-accordion-sign" aria-hidden="true"></span></button></h3><div class="sop-accordion-panel" role="region" aria-hidden="true" inert><div class="sop-accordion-clip"><div class="sop-accordion-content"><p>壁や床の反射を抑え、音の輪郭を明確に。小さな部屋にも、豊かな奥行きをつくります。</p><div class="sop-panel-tags"><span>DETAILS</span><span>CRAFT</span><span>REFERENCE</span></div></div></div></div></section>
<section class="sop-accordion-item" data-value="section-3" data-open="false"><h3 class="sop-accordion-heading"><button type="button" class="sop-accordion-trigger" aria-expanded="false"><span class="sop-accordion-index" aria-hidden="true">03</span><span class="sop-accordion-title"><b>Listening notes</b><small>試聴の記録</small></span><span class="sop-accordion-badge">LOG</span><span class="sop-accordion-sign" aria-hidden="true"></span></button></h3><div class="sop-accordion-panel" role="region" aria-hidden="true" inert><div class="sop-accordion-clip"><div class="sop-accordion-content"><p>低い音量でも声が自然に届くか。長く聴いて疲れないか。最後は数字より、耳で確かめます。</p><div class="sop-panel-foot"><span>COLLECTION / 2026</span><span>END OF NOTES ↗</span></div></div></div></div></section>
