<div class="sop-accordion sop-settings-accordion" data-sop-accordion="" data-multiple="false">
<section class="sop-accordion-item" data-value="section-1" data-open="true"><h3 class="sop-accordion-heading"><button type="button" class="sop-accordion-trigger" aria-expanded="true"><span class="sop-accordion-index" aria-hidden="true">01</span><span class="sop-accordion-title"><b>通知</b><small>Notifications</small></span><span class="sop-accordion-badge">PREFS</span><span class="sop-accordion-sign" aria-hidden="true"></span></button></h3><div class="sop-accordion-panel" role="region" aria-hidden="false" ><div class="sop-accordion-clip"><div class="sop-accordion-content"><p>必要なタイミングに、必要な通知だけ。通知を受け取る方法を選択できます。</p><label class="sop-panel-label"><span>メールで受け取る</span><input type="checkbox" checked></label><label class="sop-panel-label"><span>アプリ内に表示する</span><input type="checkbox" ></label><label class="sop-panel-label"><span>週次サマリー</span><input type="checkbox" ></label></div></div></div></section>

<section class="sop-accordion-item" data-value="section-3" data-open="false"><h3 class="sop-accordion-heading"><button type="button" class="sop-accordion-trigger" aria-expanded="false"><span class="sop-accordion-index" aria-hidden="true">03</span><span class="sop-accordion-title"><b>プライバシー</b><small>Privacy</small></span><span class="sop-accordion-badge">LOCAL</span><span class="sop-accordion-sign" aria-hidden="true"></span></button></h3><div class="sop-accordion-panel" role="region" aria-hidden="true" inert><div class="sop-accordion-clip"><div class="sop-accordion-content"><p>この展示の設定操作はページ内だけで動作します。外部サービスへの送信は行いません。</p><label class="sop-panel-label"><span>匿名の利用情報を共有</span><input type="checkbox" checked></label><label class="sop-panel-label"><span>おすすめ表示を有効にする</span><input type="checkbox" checked></label><label class="sop-panel-label"><span>履歴を端末に保存</span><input type="checkbox" checked></label></div></div></div></section>
