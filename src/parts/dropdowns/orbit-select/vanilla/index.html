<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Select</title><link rel="stylesheet" href="../styles.css"></head><body style="padding:40px;background:#191b1d"><div class="sop-select sop-orbit-select" data-value="terra" data-placeholder="選択してください">
<span class="sop-select-caption">DESTINATION / 観測地点<span aria-hidden="true">SELECT / 01</span></span>
<button class="sop-select-trigger" type="button" role="combobox" aria-label="DESTINATION / 観測地点" aria-expanded="false" aria-haspopup="listbox"><span class="sop-select-value"><span class="sop-select-icon" aria-hidden="true">T</span><span class="sop-select-option-copy"><b>Terra station</b><small>青い惑星を見下ろす軌道</small></span></span><span class="sop-select-chevron" aria-hidden="true"></span></button>
<input class="sop-select-input" type="hidden" name="orbit-select" value="terra">
<div class="sop-select-popup" role="listbox" aria-label="DESTINATION / 観測地点" hidden><div class="sop-select-menu-heading" role="presentation"><span>DESTINATION / 観測地点</span><small>04 OPTIONS</small></div>
<div class="sop-select-option" role="option" data-value="terra" data-label="Terra station" data-glyph="0" aria-selected="true"><span class="sop-select-icon" aria-hidden="true">T</span><span class="sop-select-option-copy"><b>Terra station</b><small>青い惑星を見下ろす軌道</small></span><span class="sop-select-badge">LOW</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="luna" data-label="Lunar archive" data-glyph="1" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">L</span><span class="sop-select-option-copy"><b>Lunar archive</b><small>月の裏側に眠る記録</small></span><span class="sop-select-badge">NEAR</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="io" data-label="Io observatory" data-glyph="2" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">I</span><span class="sop-select-option-copy"><b>Io observatory</b><small>火山と木星の巨大な影</small></span><span class="sop-select-badge">DEEP</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="titan" data-label="Titan relay" data-glyph="3" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">R</span><span class="sop-select-option-copy"><b>Titan relay</b><small>金色の大気、その向こう</small></span><span class="sop-select-badge">FAR</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-menu-footer" role="presentation"><span>↑ ↓ 選択</span><span>↵ 決定</span><span>esc 閉じる</span></div></div></div>
<script type="module" src="./main.ts"></script></body></html>
