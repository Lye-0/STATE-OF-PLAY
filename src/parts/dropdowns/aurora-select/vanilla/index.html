<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora Select</title><link rel="stylesheet" href="../styles.css"></head><body style="padding:40px;background:#191b1d"><div class="sop-select sop-aurora-select" data-value="arctic" data-placeholder="選択してください">
<span class="sop-select-caption">ATMOSPHERE / 空気を選ぶ<span aria-hidden="true">SELECT / 01</span></span>
<button class="sop-select-trigger" type="button" role="combobox" aria-label="ATMOSPHERE / 空気を選ぶ" aria-expanded="false" aria-haspopup="listbox"><span class="sop-select-value"><span class="sop-select-icon" aria-hidden="true">01</span><span class="sop-select-option-copy"><b>Arctic dawn</b><small>夜明けのミントと淡い光</small></span></span><span class="sop-select-chevron" aria-hidden="true"></span></button>
<input class="sop-select-input" type="hidden" name="aurora-select" value="arctic">
<div class="sop-select-popup" role="listbox" aria-label="ATMOSPHERE / 空気を選ぶ" hidden><div class="sop-select-menu-heading" role="presentation"><span>ATMOSPHERE / 空気を選ぶ</span><small>04 OPTIONS</small></div>
<div class="sop-select-option" role="option" data-value="arctic" data-label="Arctic dawn" data-glyph="0" aria-selected="true"><span class="sop-select-icon" aria-hidden="true">01</span><span class="sop-select-option-copy"><b>Arctic dawn</b><small>夜明けのミントと淡い光</small></span><span class="sop-select-badge">4800 K</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="violet" data-label="Violet hour" data-glyph="1" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">02</span><span class="sop-select-option-copy"><b>Violet hour</b><small>夕暮れの紫、静かな余韻</small></span><span class="sop-select-badge">3200 K</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="solar" data-label="Solar haze" data-glyph="2" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">03</span><span class="sop-select-option-copy"><b>Solar haze</b><small>暖かな光が満ちる午後</small></span><span class="sop-select-badge">5600 K</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="lunar" data-label="Lunar mist" data-glyph="3" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">04</span><span class="sop-select-option-copy"><b>Lunar mist</b><small>月光と深い青のあいだ</small></span><span class="sop-select-badge">6500 K</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-menu-footer" role="presentation"><span>↑ ↓ 選択</span><span>↵ 決定</span><span>esc 閉じる</span></div></div></div>
<script type="module" src="./main.ts"></script></body></html>
