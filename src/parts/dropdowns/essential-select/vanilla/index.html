<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Essential Select</title><link rel="stylesheet" href="../styles.css"></head><body style="padding:40px;background:#191b1d"><div class="sop-select sop-essential-select" data-value="draft" data-placeholder="選択してください">
<span class="sop-select-caption">STATUS / ステータス<span aria-hidden="true">SELECT / 01</span></span>
<button class="sop-select-trigger" type="button" role="combobox" aria-label="STATUS / ステータス" aria-expanded="false" aria-haspopup="listbox"><span class="sop-select-value"><span class="sop-select-icon" aria-hidden="true">D</span><span class="sop-select-option-copy"><b>下書き</b><small>編集を続けられます</small></span></span><span class="sop-select-chevron" aria-hidden="true"></span></button>
<input class="sop-select-input" type="hidden" name="essential-select" value="draft">
<div class="sop-select-popup" role="listbox" aria-label="STATUS / ステータス" hidden><div class="sop-select-menu-heading" role="presentation"><span>STATUS / ステータス</span><small>03 OPTIONS</small></div>
<div class="sop-select-option" role="option" data-value="draft" data-label="下書き" data-glyph="0" aria-selected="true"><span class="sop-select-icon" aria-hidden="true">D</span><span class="sop-select-option-copy"><b>下書き</b><small>編集を続けられます</small></span><span class="sop-select-badge"></span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="review" data-label="レビュー待ち" data-glyph="1" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">R</span><span class="sop-select-option-copy"><b>レビュー待ち</b><small>内容を確認しています</small></span><span class="sop-select-badge"></span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="published" data-label="公開済み" data-glyph="2" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">P</span><span class="sop-select-option-copy"><b>公開済み</b><small>閲覧できる状態です</small></span><span class="sop-select-badge"></span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-menu-footer" role="presentation"><span>↑ ↓ 選択</span><span>↵ 決定</span><span>esc 閉じる</span></div></div></div>
<script type="module" src="./main.ts"></script></body></html>
