<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Select</title><link rel="stylesheet" href="../styles.css"></head><body style="padding:40px;background:#191b1d"><div class="sop-select sop-team-select" data-value="ak" data-placeholder="選択してください">
<span class="sop-select-caption">ASSIGNEE / 担当者<span aria-hidden="true">SELECT / 01</span></span>
<button class="sop-select-trigger" type="button" role="combobox" aria-label="ASSIGNEE / 担当者" aria-expanded="false" aria-haspopup="listbox"><span class="sop-select-value"><span class="sop-select-icon" aria-hidden="true">AK</span><span class="sop-select-option-copy"><b>Aki Kondo</b><small>プロダクトデザイン</small></span></span><span class="sop-select-chevron" aria-hidden="true"></span></button>
<input class="sop-select-input" type="hidden" name="team-select" value="ak">
<div class="sop-select-popup" role="listbox" aria-label="ASSIGNEE / 担当者" hidden><div class="sop-select-menu-heading" role="presentation"><span>ASSIGNEE / 担当者</span><small>03 OPTIONS</small></div>
<div class="sop-select-option" role="option" data-value="ak" data-label="Aki Kondo" data-glyph="0" aria-selected="true"><span class="sop-select-icon" aria-hidden="true">AK</span><span class="sop-select-option-copy"><b>Aki Kondo</b><small>プロダクトデザイン</small></span><span class="sop-select-badge">ONLINE</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="mt" data-label="Mio Takahashi" data-glyph="1" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">MT</span><span class="sop-select-option-copy"><b>Mio Takahashi</b><small>フロントエンド開発</small></span><span class="sop-select-badge"></span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="rs" data-label="Ren Sato" data-glyph="2" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">RS</span><span class="sop-select-option-copy"><b>Ren Sato</b><small>ブランドとビジュアル</small></span><span class="sop-select-badge"></span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-menu-footer" role="presentation"><span>↑ ↓ 選択</span><span>↵ 決定</span><span>esc 閉じる</span></div></div></div>
<script type="module" src="./main.ts"></script></body></html>
