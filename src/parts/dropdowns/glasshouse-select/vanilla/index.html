<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glasshouse Select</title><link rel="stylesheet" href="../styles.css"></head><body style="padding:40px;background:#191b1d"><div class="sop-select sop-glasshouse-select" data-value="fern" data-placeholder="選択してください">
<span class="sop-select-caption">BOTANICAL / 今日の植物<span aria-hidden="true">SELECT / 01</span></span>
<button class="sop-select-trigger" type="button" role="combobox" aria-label="BOTANICAL / 今日の植物" aria-expanded="false" aria-haspopup="listbox"><span class="sop-select-value"><span class="sop-select-icon" aria-hidden="true">F</span><span class="sop-select-option-copy"><b>Bird’s nest fern</b><small>やわらかな間接光を好む</small></span></span><span class="sop-select-chevron" aria-hidden="true"></span></button>
<input class="sop-select-input" type="hidden" name="glasshouse-select" value="fern">
<div class="sop-select-popup" role="listbox" aria-label="BOTANICAL / 今日の植物" hidden><div class="sop-select-menu-heading" role="presentation"><span>BOTANICAL / 今日の植物</span><small>04 OPTIONS</small></div>
<div class="sop-select-option" role="option" data-value="fern" data-label="Bird’s nest fern" data-glyph="0" aria-selected="true"><span class="sop-select-icon" aria-hidden="true">F</span><span class="sop-select-option-copy"><b>Bird’s nest fern</b><small>やわらかな間接光を好む</small></span><span class="sop-select-badge">SHADE</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="pilea" data-label="Chinese money plant" data-glyph="1" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">P</span><span class="sop-select-option-copy"><b>Chinese money plant</b><small>丸い葉が光を集める</small></span><span class="sop-select-badge">SOFT</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="olive" data-label="Olive tree" data-glyph="2" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">O</span><span class="sop-select-option-copy"><b>Olive tree</b><small>乾いた風と、明るい窓辺</small></span><span class="sop-select-badge">SUN</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="ficus" data-label="Ficus elastica" data-glyph="3" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">R</span><span class="sop-select-option-copy"><b>Ficus elastica</b><small>厚い葉と穏やかな存在感</small></span><span class="sop-select-badge">SOFT</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-menu-footer" role="presentation"><span>↑ ↓ 選択</span><span>↵ 決定</span><span>esc 閉じる</span></div></div></div>
<script type="module" src="./main.ts"></script></body></html>
