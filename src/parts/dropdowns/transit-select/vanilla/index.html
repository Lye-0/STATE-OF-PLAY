<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transit Select</title><link rel="stylesheet" href="../styles.css"></head><body style="padding:40px;background:#191b1d"><div class="sop-select sop-transit-select" data-value="kyoto" data-placeholder="選択してください">
<span class="sop-select-caption">NEXT STOP / 行き先<span aria-hidden="true">SELECT / 01</span></span>
<button class="sop-select-trigger" type="button" role="combobox" aria-label="NEXT STOP / 行き先" aria-expanded="false" aria-haspopup="listbox"><span class="sop-select-value"><span class="sop-select-icon" aria-hidden="true">KY</span><span class="sop-select-option-copy"><b>Kyoto</b><small>路地、庭、朝の静けさ</small></span></span><span class="sop-select-chevron" aria-hidden="true"></span></button>
<input class="sop-select-input" type="hidden" name="transit-select" value="kyoto">
<div class="sop-select-popup" role="listbox" aria-label="NEXT STOP / 行き先" hidden><div class="sop-select-menu-heading" role="presentation"><span>NEXT STOP / 行き先</span><small>04 OPTIONS</small></div>
<div class="sop-select-option" role="option" data-value="kyoto" data-label="Kyoto" data-glyph="0" aria-selected="true"><span class="sop-select-icon" aria-hidden="true">KY</span><span class="sop-select-option-copy"><b>Kyoto</b><small>路地、庭、朝の静けさ</small></span><span class="sop-select-badge">09:20</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="kanazawa" data-label="Kanazawa" data-glyph="1" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">KZ</span><span class="sop-select-option-copy"><b>Kanazawa</b><small>水路と工芸をたどる</small></span><span class="sop-select-badge">11:45</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="matsumoto" data-label="Matsumoto" data-glyph="2" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">MT</span><span class="sop-select-option-copy"><b>Matsumoto</b><small>山の空気と古い街並み</small></span><span class="sop-select-badge">14:10</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="onomichi" data-label="Onomichi" data-glyph="3" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">ON</span><span class="sop-select-option-copy"><b>Onomichi</b><small>坂道の先に広がる海</small></span><span class="sop-select-badge">16:30</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-menu-footer" role="presentation"><span>↑ ↓ 選択</span><span>↵ 決定</span><span>esc 閉じる</span></div></div></div>
<script type="module" src="./main.ts"></script></body></html>
