<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clarity Select — example</title><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;background:linear-gradient(135deg,#0e2837,#49797c,#b9855e);min-height:100vh;color:#eef6fa;font-family:system-ui"><main style="padding:48px 24px;max-width:480px;margin:auto"><div class="lg-root lg-select sop-lg-clarity-select lg-quiet sop-select" data-lg-material="regular" data-lg-appearance="dark" data-value="updated" data-placeholder="選択してください"><span class="sop-select-caption">並び順</span><button class="sop-select-trigger" type="button" role="combobox" aria-label="並び順" aria-expanded="false" aria-haspopup="listbox"><span class="lg-trigger-plane lg-surface" aria-hidden="true"></span><span class="sop-select-value"><span class="sop-select-option-copy"><b>更新日時</b><small>最後に更新された順</small></span></span><span class="sop-select-chevron" aria-hidden="true"></span></button><input class="sop-select-input" type="hidden" name="sort" value="updated"><div class="sop-select-popup" role="listbox" aria-label="並び順" hidden><div class="sop-select-option" role="option" data-value="updated" data-label="更新日時" aria-selected="true"><span class="sop-select-option-copy"><b>更新日時</b><small>最後に更新された順</small></span><span class="sop-select-check" aria-hidden="true">✓</span></div><div class="sop-select-option" role="option" data-value="name" data-label="名前順" aria-selected="false"><span class="sop-select-option-copy"><b>名前順</b><small>名前で並べ替える</small></span><span class="sop-select-check" aria-hidden="true">✓</span></div><div class="sop-select-option" role="option" data-value="created" data-label="追加した順" aria-selected="false"><span class="sop-select-option-copy"><b>追加した順</b><small>新しく追加したものから</small></span><span class="sop-select-check" aria-hidden="true">✓</span></div><div class="sop-select-option" role="option" data-value="size" data-label="サイズ順" aria-selected="false"><span class="sop-select-option-copy"><b>サイズ順</b><small>大きいものから</small></span><span class="sop-select-check" aria-hidden="true">✓</span></div></div></div></main><script type="module" src="./main.ts"></script></body></html>
