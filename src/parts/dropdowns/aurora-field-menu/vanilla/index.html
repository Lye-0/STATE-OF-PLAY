<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora Drift</title><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;padding:32px;background:#171a1d;color:#e8eee7;font:14px Arial,sans-serif"><main style="max-width:420px;margin:auto"><div data-demo class="sop-select sop-kinetic-select sop-aurora-field-menu" data-value="recent" data-placeholder="選択してください">
<span class="sop-select-caption">並び順</span>
<button class="sop-select-trigger" type="button" role="combobox" aria-label="並び順" aria-haspopup="listbox" aria-expanded="false"><span class="sop-select-value"><span class="sop-select-option-copy"><b>最近更新した順</b><small>いま動いているものから</small></span></span><span class="sop-select-chevron" aria-hidden="true"></span></button>
<input class="sop-select-input" type="hidden" name="sort" value="recent">
<div class="sop-select-popup" role="listbox" aria-label="並び順" hidden>
<div class="sop-select-option" role="option" data-value="recent" data-label="最近更新した順" aria-selected="true"><span class="sop-select-option-copy"><b>最近更新した順</b><small>いま動いているものから</small></span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="name" data-label="名前の昇順" aria-selected="false"><span class="sop-select-option-copy"><b>名前の昇順</b><small>A–Z、五十音順で整える</small></span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="created" data-label="作成日の新しい順" aria-selected="false"><span class="sop-select-option-copy"><b>作成日の新しい順</b><small>新しく加わったものから</small></span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="priority" data-label="優先度の高い順" aria-selected="false"><span class="sop-select-option-copy"><b>優先度の高い順</b><small>大切なものを先頭に</small></span><span class="sop-select-check" aria-hidden="true">✓</span></div>
</div></div>
<p>文言・ラベル・内容は利用先に合わせて差し替えてください。</p></main><script type="module" src="./main.ts"></script></body></html>
