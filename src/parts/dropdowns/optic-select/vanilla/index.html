<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Optic Select</title><link rel="stylesheet" href="../styles.css"></head><body style="padding:40px;background:#191b1d"><div class="sop-select sop-optic-select" data-value="wide" data-placeholder="選択してください">
<span class="sop-select-caption">LENS SYSTEM / 焦点距離<span aria-hidden="true">SELECT / 01</span></span>
<button class="sop-select-trigger" type="button" role="combobox" aria-label="LENS SYSTEM / 焦点距離" aria-expanded="false" aria-haspopup="listbox"><span class="sop-select-value"><span class="sop-select-icon" aria-hidden="true">24</span><span class="sop-select-option-copy"><b>Wide angle</b><small>風景の奥行きを、そのまま</small></span></span><span class="sop-select-chevron" aria-hidden="true"></span></button>
<input class="sop-select-input" type="hidden" name="optic-select" value="wide">
<div class="sop-select-popup" role="listbox" aria-label="LENS SYSTEM / 焦点距離" hidden><div class="sop-select-menu-heading" role="presentation"><span>LENS SYSTEM / 焦点距離</span><small>04 OPTIONS</small></div>
<div class="sop-select-option" role="option" data-value="wide" data-label="Wide angle" data-glyph="0" aria-selected="true"><span class="sop-select-icon" aria-hidden="true">24</span><span class="sop-select-option-copy"><b>Wide angle</b><small>風景の奥行きを、そのまま</small></span><span class="sop-select-badge">f/1.8</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="normal" data-label="Everyday lens" data-glyph="1" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">35</span><span class="sop-select-option-copy"><b>Everyday lens</b><small>日常を自然な距離から</small></span><span class="sop-select-badge">f/1.4</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="portrait" data-label="Portrait prime" data-glyph="2" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">85</span><span class="sop-select-option-copy"><b>Portrait prime</b><small>柔らかな背景と表情</small></span><span class="sop-select-badge">f/1.8</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="tele" data-label="Telephoto" data-glyph="3" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">135</span><span class="sop-select-option-copy"><b>Telephoto</b><small>遠くの輪郭を引き寄せる</small></span><span class="sop-select-badge">f/2.8</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-menu-footer" role="presentation"><span>↑ ↓ 選択</span><span>↵ 決定</span><span>esc 閉じる</span></div></div></div>
<script type="module" src="./main.ts"></script></body></html>
