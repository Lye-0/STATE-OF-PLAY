<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slate Select</title><link rel="stylesheet" href="../styles.css"></head><body style="padding:40px;background:#191b1d"><div class="sop-select sop-slate-select" data-value="personal" data-placeholder="選択してください">
<span class="sop-select-caption">WORKSPACE / ワークスペース<span aria-hidden="true">SELECT / 01</span></span>
<button class="sop-select-trigger" type="button" role="combobox" aria-label="WORKSPACE / ワークスペース" aria-expanded="false" aria-haspopup="listbox"><span class="sop-select-value"><span class="sop-select-icon" aria-hidden="true">P</span><span class="sop-select-option-copy"><b>Personal</b><small>自分だけの作業スペース</small></span></span><span class="sop-select-chevron" aria-hidden="true"></span></button>
<input class="sop-select-input" type="hidden" name="slate-select" value="personal">
<div class="sop-select-popup" role="listbox" aria-label="WORKSPACE / ワークスペース" hidden><div class="sop-select-menu-heading" role="presentation"><span>WORKSPACE / ワークスペース</span><small>03 OPTIONS</small></div>
<div class="sop-select-option" role="option" data-value="personal" data-label="Personal" data-glyph="0" aria-selected="true"><span class="sop-select-icon" aria-hidden="true">P</span><span class="sop-select-option-copy"><b>Personal</b><small>自分だけの作業スペース</small></span><span class="sop-select-badge">1</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="design" data-label="Design team" data-glyph="1" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">D</span><span class="sop-select-option-copy"><b>Design team</b><small>チームで共有する場所</small></span><span class="sop-select-badge">8</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="archive" data-label="Archive" data-glyph="2" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">A</span><span class="sop-select-option-copy"><b>Archive</b><small>完成したプロジェクト</small></span><span class="sop-select-badge">24</span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-menu-footer" role="presentation"><span>↑ ↓ 選択</span><span>↵ 決定</span><span>esc 閉じる</span></div></div></div>
<script type="module" src="./main.ts"></script></body></html>
