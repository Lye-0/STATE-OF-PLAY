<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compact Select</title><link rel="stylesheet" href="../styles.css"></head><body style="padding:40px;background:#191b1d"><div class="sop-select sop-compact-select" data-value="10" data-placeholder="選択してください">
<span class="sop-select-caption">DISPLAY / 表示件数<span aria-hidden="true">SELECT / 01</span></span>
<button class="sop-select-trigger" type="button" role="combobox" aria-label="DISPLAY / 表示件数" aria-expanded="false" aria-haspopup="listbox"><span class="sop-select-value"><span class="sop-select-icon" aria-hidden="true">10</span><span class="sop-select-option-copy"><b>10件ずつ</b><small>少ない項目を集中して読む</small></span></span><span class="sop-select-chevron" aria-hidden="true"></span></button>
<input class="sop-select-input" type="hidden" name="compact-select" value="10">
<div class="sop-select-popup" role="listbox" aria-label="DISPLAY / 表示件数" hidden><div class="sop-select-menu-heading" role="presentation"><span>DISPLAY / 表示件数</span><small>03 OPTIONS</small></div>
<div class="sop-select-option" role="option" data-value="10" data-label="10件ずつ" data-glyph="0" aria-selected="true"><span class="sop-select-icon" aria-hidden="true">10</span><span class="sop-select-option-copy"><b>10件ずつ</b><small>少ない項目を集中して読む</small></span><span class="sop-select-badge"></span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="25" data-label="25件ずつ" data-glyph="1" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">25</span><span class="sop-select-option-copy"><b>25件ずつ</b><small>日常の一覧に</small></span><span class="sop-select-badge"></span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-option" role="option" data-value="50" data-label="50件ずつ" data-glyph="2" aria-selected="false"><span class="sop-select-icon" aria-hidden="true">50</span><span class="sop-select-option-copy"><b>50件ずつ</b><small>まとめて確認する</small></span><span class="sop-select-badge"></span><span class="sop-select-check" aria-hidden="true">✓</span></div>
<div class="sop-select-menu-footer" role="presentation"><span>↑ ↓ 選択</span><span>↵ 決定</span><span>esc 閉じる</span></div></div></div>
<script type="module" src="./main.ts"></script></body></html>
