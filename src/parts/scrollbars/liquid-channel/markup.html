<div class="sop-scroll-area sop-kinetic-scroll sop-liquid-channel" data-orientation="vertical">

    <canvas class="sop-kinetic-canvas" aria-hidden="true"></canvas><span class="sop-scroll-track" aria-hidden="true"><span class="sop-scroll-fill"></span></span><span class="sop-scroll-ticks" aria-hidden="true"></span>
    <div class="sop-scroll-thumb"><span class="sop-scroll-handle" aria-hidden="true"><i class="sop-scroll-grip"></i></span></div>
    <span class="sop-scroll-cap" aria-hidden="true"></span><span class="sop-scroll-cap" aria-hidden="true"></span>
  </div>
</div>
