<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Tabs</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#171b1a;color:#eef0e7;font-family:Arial,"Yu Gothic",sans-serif;padding:30px}main{max-width:580px;margin:30px auto}</style></head><body><main><div class="sop-choice sop-tabs sop-signal-tabs" data-selection-kind="tabs" data-value="choice-1" data-orientation="horizontal"><div class="sop-choice-list" role="tablist" aria-label="Signal Tabs"><span class="sop-choice-marker" aria-hidden="true"></span><button type="button" role="tab" class="sop-choice-item" data-choice-value="choice-1" data-selected="true" aria-selected="true" tabindex="0"><span class="sop-choice-index" aria-hidden="true">01</span><span class="sop-choice-label">Status</span><span class="sop-choice-dot" aria-hidden="true"></span></button><button type="button" role="tab" class="sop-choice-item" data-choice-value="choice-2" data-selected="false" aria-selected="false" tabindex="-1"><span class="sop-choice-index" aria-hidden="true">02</span><span class="sop-choice-label">Stream</span><span class="sop-choice-dot" aria-hidden="true"></span></button><button type="button" role="tab" class="sop-choice-item" data-choice-value="choice-3" data-selected="false" aria-selected="false" tabindex="-1"><span class="sop-choice-index" aria-hidden="true">03</span><span class="sop-choice-label">Notes</span><span class="sop-choice-dot" aria-hidden="true"></span></button></div><div class="sop-choice-panels"><section class="sop-choice-panel" data-panel-value="choice-1" role="tabpanel" tabindex="0"><div class="sop-choice-demo" data-illustration="signal"><span class="sop-choice-demo-kicker">PHOSPHOR / TERMINAL</span><span class="sop-choice-demo-art" aria-hidden="true"></span><h3>A different<br><em>perspective.</em></h3><p>信号を、選び取る。<br>見出しを選ぶと、内容が切り替わります。</p><div class="sop-choice-demo-footer"><span>COLLECTION / 01</span><b>01 — 03</b></div></div></section><section class="sop-choice-panel" data-panel-value="choice-2" role="tabpanel" tabindex="0" hidden><div class="sop-choice-demo"><span class="sop-choice-demo-kicker">DESIGN SPECIFICATION</span><h3>Built for<br><em>your ideas.</em></h3><ul class="sop-choice-demo-list"><li>構成<b>項目数を自由に変更</b></li><li>入力内容<b>切り替えても保持</b></li><li>移動方法<b>キー・クリック</b></li></ul></div></section><section class="sop-choice-panel" data-panel-value="choice-3" role="tabpanel" tabindex="0" hidden><div class="sop-choice-demo"><span class="sop-choice-demo-kicker">YOUR FIELD NOTES</span><h3>A thought<br><em>worth keeping.</em></h3><label>メモ<input type="text" placeholder="アイデアをここに…" aria-label="このタブのメモ"></label><p>表示を切り替えても、入力は残ります。<br>ページを離れると消えるデモです。</p></div></section></div></div>
</main><script type="module" src="./main.ts"></script></body></html>
