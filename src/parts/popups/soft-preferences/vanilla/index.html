<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soft Preferences</title><link rel="stylesheet" href="../styles.css"></head><body style="margin:32px;background:#181c1f;color:#e5e9e2"><div class="sop-popup sop-soft-preferences"><button type="button" class="sop-popup-trigger" data-popup-open aria-haspopup="dialog"><span>Open Soft Preferences</span><span aria-hidden="true">↗</span></button><dialog class="sop-popup-window"><div class="sop-popup-shell"><header class="sop-popup-top"><span class="sop-popup-kicker">PREFERENCES</span><button type="button" class="sop-popup-close" data-popup-close="close" aria-label="ポップアップを閉じる"><span aria-hidden="true">×</span></button></header><div class="sop-popup-intro"><h2 data-popup-title tabindex="-1">表示と通知</h2><p>毎日の使い方に合わせて設定できます。</p></div><div class="sop-popup-body"><div class="pp-preferences"><label><span>新しいお知らせ<small>大切な更新を受け取ります</small></span><input type="checkbox" checked></label><label><span>静かなモード<small>通知の頻度を控えめにします</small></span><input type="checkbox"></label></div></div><footer class="sop-popup-footer"><button type="button" class="sop-popup-secondary" data-popup-close="cancel">閉じる</button><button type="button" class="sop-popup-primary" data-popup-close="confirm">設定を確認<span aria-hidden="true">↗</span></button></footer></div></dialog></div><script type="module" src="./main.ts"></script></body></html>
