<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mist Dialog</title><link rel="stylesheet" href="../styles.css"></head><body style="margin:32px;background:#181c1f;color:#e5e9e2"><div class="sop-popup lgc-root sop-lgc-popups-mist"><button type="button" class="sop-popup-trigger" data-popup-open aria-haspopup="dialog"><span>Open Paper</span><span aria-hidden="true">↗</span></button><dialog class="sop-popup-window"><div class="sop-popup-shell"><header class="sop-popup-top"><span class="sop-popup-kicker">EDIT DETAILS</span><button type="button" class="sop-popup-close" data-popup-close="close" aria-label="ポップアップを閉じる"><span aria-hidden="true">×</span></button></header><div class="sop-popup-intro"><h2 data-popup-title tabindex="-1">名前を変更</h2><p>新しい表示名を入力してください。</p></div><div class="sop-popup-body"><div class="pp-fields"><label>表示名<input type="text" placeholder="プロジェクト名"></label></div></div><footer class="sop-popup-footer"><button type="button" class="sop-popup-secondary" data-popup-close="cancel">キャンセル</button><button type="button" class="sop-popup-primary" data-popup-close="confirm">変更する<span aria-hidden="true">↗</span></button></footer></div></dialog></div><script type="module" src="./main.ts"></script></body></html>
