<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nixie Console</title><link rel="stylesheet" href="../styles.css"></head><body style="margin:32px;background:#181c1f;color:#e5e9e2"><div class="sop-popup sop-nixie-console"><button type="button" class="sop-popup-trigger" data-popup-open aria-haspopup="dialog"><span>Open Nixie Console</span><span aria-hidden="true">↗</span></button><dialog class="sop-popup-window"><div class="sop-popup-shell"><header class="sop-popup-top"><span class="sop-popup-kicker">SIGNAL / CHANNEL 06</span><button type="button" class="sop-popup-close" data-popup-close="close" aria-label="ポップアップを閉じる"><span aria-hidden="true">×</span></button></header><div class="sop-popup-intro"><h2 data-popup-title tabindex="-1">Transmission complete.</h2><p>デモの処理が完了しました。実際の通信は行いません。</p></div><div class="sop-popup-body"><div class="pp-metrics"><div><small>PACKETS</small><b>024</b></div><div><small>LATENCY</small><b>12 ms</b></div><div><small>STATUS</small><b>OK</b></div></div><ul class="pp-lines"><li><span>Session</span><b>SOP-06</b></li><li><span>Integrity</span><b>Verified</b></li><li><span>Mode</span><b>Local demo</b></li></ul></div><footer class="sop-popup-footer"><button type="button" class="sop-popup-secondary" data-popup-close="cancel">閉じる</button><button type="button" class="sop-popup-primary" data-popup-close="confirm">了解<span aria-hidden="true">↗</span></button></footer></div></dialog></div><script type="module" src="./main.ts"></script></body></html>
