<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notice Dialog</title><link rel="stylesheet" href="../styles.css"></head><body style="margin:32px;background:#181c1f;color:#e5e9e2"><div class="sop-popup sop-notice-dialog"><button type="button" class="sop-popup-trigger" data-popup-open aria-haspopup="dialog"><span>Open Notice</span><span aria-hidden="true">↗</span></button><dialog class="sop-popup-window"><div class="sop-popup-shell"><header class="sop-popup-top"><span class="sop-popup-kicker">INFORMATION</span><button type="button" class="sop-popup-close" data-popup-close="close" aria-label="ポップアップを閉じる"><span aria-hidden="true">×</span></button></header><div class="sop-popup-intro"><h2 data-popup-title tabindex="-1">準備が整いました</h2><p>続ける前に、以下の内容をご確認ください。</p></div><div class="sop-popup-body"><ol class="pp-steps"><li><div><b>プレビューを確認</b>変更内容をこの画面で見直せます。</div></li><li><div><b>必要なときに実行</b>ボタンの処理は利用先のアプリと接続します。</div></li></ol></div><footer class="sop-popup-footer"><button type="button" class="sop-popup-secondary" data-popup-close="cancel">閉じる</button><button type="button" class="sop-popup-primary" data-popup-close="confirm">わかりました<span aria-hidden="true">↗</span></button></footer></div></dialog></div><script type="module" src="./main.ts"></script></body></html>
