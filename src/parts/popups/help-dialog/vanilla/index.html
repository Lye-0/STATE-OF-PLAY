<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Help Dialog</title><link rel="stylesheet" href="../styles.css"></head><body style="margin:32px;background:#181c1f;color:#e5e9e2"><div class="sop-popup sop-help-dialog"><button type="button" class="sop-popup-trigger" data-popup-open aria-haspopup="dialog"><span>Open Help</span><span aria-hidden="true">↗</span></button><dialog class="sop-popup-window"><div class="sop-popup-shell"><header class="sop-popup-top"><span class="sop-popup-kicker">QUICK GUIDE</span><button type="button" class="sop-popup-close" data-popup-close="close" aria-label="ポップアップを閉じる"><span aria-hidden="true">×</span></button></header><div class="sop-popup-intro"><h2 data-popup-title tabindex="-1">使い方を確認</h2><p>3つのステップで、このパーツを導入できます。</p></div><div class="sop-popup-body"><ol class="pp-steps"><li><div><b>パーツを選ぶ</b>必要な形式と配置を選択します。</div></li><li><div><b>ソースを配置する</b>内部の参照を保って、フォルダーを配置します。</div></li><li><div><b>画面へ接続する</b>ラベル・状態・処理をアプリに合わせます。</div></li></ol></div><footer class="sop-popup-footer"><button type="button" class="sop-popup-secondary" data-popup-close="cancel">閉じる</button><button type="button" class="sop-popup-primary" data-popup-close="confirm">はじめる<span aria-hidden="true">↗</span></button></footer></div></dialog></div><script type="module" src="./main.ts"></script></body></html>
