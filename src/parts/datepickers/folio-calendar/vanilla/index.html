<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio Calendar</title><link rel="stylesheet" href="../styles.css"></head><body><div class="sop-foundation sop-continuum sop-folio-calendar" data-foundation="datepickers" data-variant="folio"><div class="ff-heading"><span data-ff-label>次の時間を、予約する。</span><span class="ff-eyebrow" aria-hidden="true">STATE / PLAY</span></div><p class="ff-description" data-ff-description></p><div class="ff-date-fields"><input data-date="0" type="date" aria-label="次の時間を、予約する。"><span data-date-separator hidden>—</span><input data-date="1" type="date" aria-label="次の時間を、予約する。 終了日" hidden><button type="button" data-calendar-toggle class="ff-icon-button" aria-label="カレンダーを開く" ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4m8-4v4"/></svg></button></div><div class="ff-floating ff-calendar" data-calendar><div class="ct-calendar-envelope" aria-hidden="true"><i></i><i></i><i></i></div><div class="ct-calendar-mast"><div class="ct-calendar-identity"><span data-ct-date-caption>日付を選択</span><strong data-ct-date-number>—</strong></div><div class="ct-calendar-scene" aria-hidden="true"></div></div><header class="ff-calendar-header"><button type="button" data-month="-1" aria-label="前の月">‹</button><strong data-month-title aria-live="polite"></strong><button type="button" data-month="1" aria-label="次の月">›</button></header><div class="ff-weekdays" aria-hidden="true"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span></div><div class="ct-calendar-page"><div class="ct-calendar-sheet" aria-hidden="true"></div><div class="ff-calendar-grid" data-calendar-grid role="grid" aria-label="日付を選択"></div></div><footer><button type="button" data-today>今日</button><span>LOCAL DATE</span><button type="button" data-date-clear>クリア</button></footer></div><span class="ff-date-message" data-date-message role="status"></span></div>
<script type="module" src="./main.ts"></script></body></html>
